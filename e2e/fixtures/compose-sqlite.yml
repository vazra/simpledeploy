services:
  app:
    # Gitea itself does not run: the image is used because it ships sqlite3
    # and busybox (sh, tar, cp) and is already mirrored for the Gitea
    # template, so the fixture needs no package download at test time.
    image: gitea/gitea:1.26
    entrypoint:
      - sh
      - -c
      - >-
        sqlite3 /data/test.db "CREATE TABLE IF NOT EXISTS e2e_items(id INTEGER PRIMARY KEY, v TEXT);" &&
        trap 'exit 0' TERM INT &&
        while :; do sleep 1; done
    volumes:
      - sqlitedata:/data
    labels:
      simpledeploy.backup.strategy: "sqlite"
volumes:
  sqlitedata:
