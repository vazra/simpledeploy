name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ui-build
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # golangci-lint v2 is required because go.mod targets go1.26
          # and the last v1 release (v1.64.8) was built with go1.24.
          # The v6 action doesn't understand v2 version strings; keep the
          # action version in sync with the CLI version.
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ui-build
      - run: go test -race ./...

  # Blocking. Fails on any vulnerability whose vulnerable code is actually
  # called, except the two docker/docker advisories that have no fixed
  # release yet (GO-2026-4887, GO-2026-4883). The log lists the called IDs.
  # Findings that are only imported or required (not reachable) do not fail
  # the job and are not listed; run `govulncheck -show verbose ./...` locally
  # to see them. Drop an ID from ALLOWED once docker ships a fix.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # cmd/simpledeploy embeds ui_dist, so the UI must be built first.
      - run: make ui-build
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck (called findings, docker allowlist)
        env:
          ALLOWED: GO-2026-4887|GO-2026-4883
        run: |
          set -o pipefail
          # JSON mode exits 0 even with findings, so a non-zero exit here is a
          # real scan error and fails the step.
          govulncheck -format json ./... > vuln.json
          jq -e 'select(.config)' vuln.json > /dev/null
          jq -r 'select(.finding) | .finding | select(.trace[0].function != null) | .osv' vuln.json | sort -u > called.txt
          echo "Called vulnerabilities:"
          cat called.txt
          unexpected=$(grep -vxE "$ALLOWED" called.txt || true)
          if [ -n "$unexpected" ]; then
            echo "::error::govulncheck found called vulnerabilities outside the allowlist: $(tr '\n' ' ' <<< "$unexpected")"
            govulncheck ./... || true
            exit 1
          fi

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cd ui && npm ci && npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build

  e2e:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # docker login to GHCR for mirrored image pulls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Authenticate the docker daemon to GHCR so deploy-time `docker
      # compose pull` can fetch mirrored images. Avoids Docker Hub
      # anonymous pull rate limits that produced 5+ min hangs in this
      # job. The same pattern is used by the Templates workflow.
      - name: Log in to GHCR for mirror pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - run: make e2e
        env:
          E2E_USE_MIRROR: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
